<!-- Indicamos Html 5-->
<!DOCTYPE html>
<!-- Tag html e idioma-->
<html lang="es">

<head>
    <!-- Indicamos tipo de caracteres - Todos los idiomas -->
    <meta charset="UTF-8">
    <!-- Ancho de pantalla es Ancho del dispositivo - Escala 1 x 1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Libreria React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <!-- Libreria React-Dom -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Libreria Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>

    <!-- Generamos tag donde se renderizara -->
    <div id="uno"></div>
    <div id="dos"></div>
    <div id="tres"></div>
    <div id="cuatro"></div>
    <div id="root"></div>

    <!-- Funcion Convencional-->
    <script>
        function funcion() {

            console.log('Funcion Convencional');
        }
        funcion();
    </script>

    <!-- Funcion flecha-->

    <script>

        (() => console.log('Funcion Flecha'))()
    </script>

    <!-- Clase Convencional -->
    <script>

        class Clase {

            constructor(atr) {
                this.atr = atr;
            }
            saludo() {

                return console.log(this.atr)
            }
        }
        var objeto = new Clase('Clase Convencional');
        objeto.saludo();

    </script>

    <!-- Componente Funcion desde Js-->
    <script>

        function CmFnJs(props) {

            return React.createElement('h3', null, props)
        }

        var rootDom = document.getElementById('uno');
        var root = ReactDOM.createRoot(rootDom);
        root.render(CmFnJs('Componente Funcion desde Js'))

    </script>

    <!-- Componente Clase desde Js-->

    <script>

        class CmClJs extends React.Component {

            constructor(props) {
                super(props);
            }
            render() {
                return React.createElement('h3', null, this.props);
            }
        }
        var nodoRaiz = document.getElementById('dos');
        var raiz = ReactDOM.createRoot(nodoRaiz);
        var objeto2 = new CmClJs('Componente Clase desde Js')
        raiz.render(objeto2.render());

    </script>

    <!-- Componente Funcion desde Jsx-->
    <script type="text/babel">

        function CmFnJsx(props) {

            return (<h3>{props.fnjsx}</h3>)

        }
        var nodo3 = document.getElementById('tres');
        var raiz = ReactDOM.createRoot(nodo3);
        var v3 = 'Componente Funcion desde Jsx';
        raiz.render(<CmFnJsx fnjsx={v3} />);

    </script>

    <script type="text/babel">

        class CmClJsx extends React.Component {

            constructor(props) { super(props); }
            render() {
                return (

                    <h3>{this.props.tipo}</h3>
                )
            }
        }
        var v4 = 'Componente Clase desde Jsx';
        var nodoCuatro = document.getElementById('cuatro');
        var raiz = ReactDOM.createRoot(nodoCuatro);
        raiz.render(<CmClJsx tipo={v4} />)
    </script>
</body>

</html>
